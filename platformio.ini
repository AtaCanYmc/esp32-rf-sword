; ===============================================================================
;  ESP32-RF-SWORD: Advanced Multi-Band RF Security & Research Toolkit
;  Build Configuration for PlatformIO
; ===============================================================================

[platformio]
default_envs = esp32-c3-supermini, esp32-devkit-v1, esp32-s3-devkit
src_dir = src
include_dir = include
data_dir = data

[common]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
build_unflags = 
    -std=gnu++11
    -std=gnu++14
build_flags =
    -std=gnu++17
    -D SWORD_VERSION=\"2.5.0\"
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_LOOP_STACK_SIZE=16384
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
lib_deps =
    nrf24/RF24 @ ^1.4.10
    jgromes/RadioLib @ ^6.6.0
    bblanchon/ArduinoJson @ ^7.1.0
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit GFX Library @ ^1.11.9

; -------------------------------------------------------------------------------
; Target 1: ESP32-C3 SuperMini (Headless & Compact 2.4GHz RF Sweeper)
; -------------------------------------------------------------------------------
[env:esp32-c3-supermini]
platform = espressif32 @ 6.6.0
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
board_build.flash_mode = qio
build_flags =
    ${common.build_flags}
    -D BOARD_ESP32_C3_SUPERMINI
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = ${common.lib_deps}

; -------------------------------------------------------------------------------
; Target 2: ESP32 DevKit V1 / WROOM-32 (Dual-Core, Dual-nRF24 + CC1101 + OLED)
; -------------------------------------------------------------------------------
[env:esp32-devkit-v1]
platform = espressif32 @ 6.6.0
board = esp32doit-devkit-v1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
board_build.flash_mode = dio
build_flags =
    ${common.build_flags}
    -D BOARD_ESP32_DEVKIT_V1
lib_deps = ${common.lib_deps}

; -------------------------------------------------------------------------------
; Target 3: ESP32-S3 DevKit (Dual-Core LX7, High Power Quad-Radio + LCD)
; -------------------------------------------------------------------------------
[env:esp32-s3-devkit]
platform = espressif32 @ 6.6.0
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
board_build.flash_mode = qio
build_flags =
    ${common.build_flags}
    -D BOARD_ESP32_S3_DEVKIT
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = ${common.lib_deps}

; -------------------------------------------------------------------------------
; Target 4: ESP32-C6 DevKit (Wi-Fi 6 / 802.15.4 Zigbee Native Radio + nRF24)
; -------------------------------------------------------------------------------
[env:esp32-c6-devkit]
platform = espressif32 @ 6.6.0
board = esp32-c6-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
build_flags =
    ${common.build_flags}
    -D BOARD_ESP32_C6_DEVKIT
lib_deps = ${common.lib_deps}

; -------------------------------------------------------------------------------
; Target 5: Native Test Runner (Host-side Unit Testing via Clang/GCC)
; -------------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -D UNIT_TEST
    -D HOST_SIMULATION
